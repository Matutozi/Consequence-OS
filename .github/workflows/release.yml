# Publishes a release when a version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# It runs the tests, then makes a GitHub Release with binaries for Linux
# and macOS (amd64 and arm64) plus SHA256SUMS, and pushes the Docker image
# to ghcr.io/matutozi/consequence-os for amd64 and arm64.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make lint
      - run: go test -count=1 ./...
      - run: go test -count=1 ./...
        working-directory: cmd/consequence-anchor

  binaries:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build archives
        run: scripts/build-release.sh "$GITHUB_REF_NAME"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # Tags with a hyphen (v0.2.0-rc.1) are marked as pre-releases.
        run: |
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" --generate-notes "${flags[@]}"

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # to push to ghcr.io
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          # Registry names must be lower case.
          images: ghcr.io/matutozi/consequence-os
          # v1.2.3 is tagged 1.2.3, 1.2 and latest; a pre-release such as
          # v1.3.0-rc.1 gets only its own tag.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
