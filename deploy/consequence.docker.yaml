# ConsequenceOS config for docker-compose. Same policy as consequence.yaml;
# only the addresses, storage and email differ. Secrets come from .env.

listen: "0.0.0.0:8080"                  # inside the container; compose publishes it on 127.0.0.1
public_url: "http://localhost:8080"      # what links in emails point at
upstream: "http://mockmcp:9090/mcp"
approval_validity: 10m   # how long an approval stays usable once granted
approval_timeout: 1h     # how long a held call waits for a decision
max_pending_approvals: 20  # per agent; past this, new asks are refused, not emailed

admin_token_env: CONSEQUENCE_ADMIN_TOKEN
allowed_origins: []

receipts:
  ttl: 5m
  ed25519_key_env: CONSEQUENCE_SIGNING_KEY_ED25519
  mldsa87_key_env: CONSEQUENCE_SIGNING_KEY_MLDSA87

database_url_env: CONSEQUENCE_DATABASE_URL

email:
  smtp_url_env: CONSEQUENCE_SMTP_URL
  from: approvals@acme.example

owners:
  - id: acme
    approvers: [ada@acme.example]

agents:
  - id: support-bot
    owner_id: acme
    api_key_env: CONSEQUENCE_KEY_SUPPORT_BOT

# Receivers may check receipts with POST /v1/receipts/verify, which also
# marks each receipt used, so each one needs its own key.
receivers:
  - id: payments-api
    api_key_env: CONSEQUENCE_KEY_RECEIVER_PAYMENTS
# The receiver behind upstream. Receipts name it (receipt v1), so no other
# receiver will accept them.
upstream_receiver: payments-api

# Consequence level per tool: read, reversible or irreversible.
# Tools not listed here are treated as irreversible.
tools:
  notes.read: read
  payments.refund: irreversible
  purchase_order.confirm: irreversible

# Evaluated top to bottom; the first match wins. With no match, read tools
# are allowed and everything else asks a human.
#
# "when" takes one condition or a list; every condition in a list must hold.
# Ops: eq, ne, gt, gte, lt, lte, and in / not_in with a list value.
#
# A rule can also have:
#   limit:   { max: 10, per: 24h }               matches from this agent's 11th call in 24h
#   limit:   { sum: amount, max: 500, per: 24h } matches once the 24h total would pass 500
#   during:  { days: [...], hours: "09:00-17:00", timezone: ... }  applies only in that window
#   outside: { ... }                                                applies only outside it
# Everything a rule sets must hold for it to match.
rules:
  - name: small-po-trusted-supplier
    tool: purchase_order.confirm
    when:
      - { arg: amount, op: lt, value: 500 }
      - { arg: supplier, op: in, value: [Coleman Cables, Acme Steel] }
    action: allow
  - name: po-needs-manager
    tool: purchase_order.confirm
    action: ask
  # Small refunds go through on their own, but only up to $500 a day per
  # agent; past that, even a small one needs a human.
  - name: small-refunds-daily-cap
    tool: payments.refund
    when: { arg: amount, op: lte, value: 50 }
    limit: { sum: amount, max: 500, per: 24h }
    action: ask
  - name: small-refunds
    tool: payments.refund
    when: { arg: amount, op: lte, value: 50 }
    action: allow
  # Rules can also apply only at certain times. For example, to ask a human
  # about every refund outside office hours, put this above the refund rules:
  #
  # - name: after-hours-refunds
  #   tool: payments.refund
  #   outside: { days: [mon, tue, wed, thu, fri], hours: "09:00-17:00", timezone: Africa/Lagos }
  #   action: ask
  - name: big-refunds
    tool: payments.refund
    action: ask
  - name: no-prod-deletes
    tool: db.delete*
    action: deny
